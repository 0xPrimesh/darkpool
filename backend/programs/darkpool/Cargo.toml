[package]
name = "darkpool"
version = "0.1.0"
description = "Dark pool MXE: encrypted limit-order matching on Arcium"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "darkpool"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "arcium-anchor/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []
# Localnet only: lets `set_mock_price` write a Pyth-shaped price account owned
# by this program, and lets `match_orders` accept it. NEVER enable for a
# devnet/mainnet deployment; without it the mock path is compiled out.
mock-oracle = []

[dependencies]
anchor-lang = { version = "1.0.2", features = ["init-if-needed"] }
arcium-client = { default-features = false, version = "=0.13.2" }
arcium-macros = "=0.13.2"
arcium-anchor = "=0.13.2"
solana-sha256-hasher = "3.1.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
